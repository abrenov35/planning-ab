<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>AB Planning - Gantt</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📅</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #root {
      touch-action: auto;
    }

    /* PC : masquer uniquement la barre verticale et garder la barre horizontale */
    #root div[style*="scrollbar-width: none"] {
      scrollbar-width: auto !important;
    }
    #root div[style*="scrollbar-width: none"]::-webkit-scrollbar,
    .gantt-scroll-desktop::-webkit-scrollbar {
      width: 0;
      height: 12px;
    }
    #root div[style*="scrollbar-width: none"]::-webkit-scrollbar-thumb,
    .gantt-scroll-desktop::-webkit-scrollbar-thumb {
      background: #9ca3af;
      border-radius: 999px;
    }
    #root div[style*="scrollbar-width: none"]::-webkit-scrollbar-track,
    .gantt-scroll-desktop::-webkit-scrollbar-track {
      background: #f3f4f6;
    }

    /* V87 : affectations plus lisibles sans modifier la largeur des 4 semaines */
    .gantt-scroll div[title] {
      font-size: 11px !important;
    }
    .gantt-scroll div[title] + div[title] {
      font-size: 8px !important;
      height: 9px !important;
      line-height: 9px !important;
    }
    @media (max-width: 1100px) and (pointer: coarse) {
      .gantt-scroll div[title] {
        font-size: 9px !important;
      }
      .gantt-scroll div[title] + div[title] {
        font-size: 8px !important;
        height: 9px !important;
        line-height: 9px !important;
      }
    }

    /* Blocs Google hors Gantt : gris visible, sans texte */
    #root div[title]:empty {
      background-color: #9CA3AF !important;
      background-image: none !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body>
  <noscript>Tu dois activer JavaScript pour utiliser cette app.</noscript>
  <div id="root"></div>
  <script>
    /* Suppression d'affectation : un seul clic utilisateur.
       La seconde étape historique est déclenchée automatiquement sans demander
       une confirmation supplémentaire à l'utilisateur. */
    const abDeleteObserver = new MutationObserver(() => {
      const confirmButton = Array.from(document.querySelectorAll('button')).find(
        button => button.textContent.trim() === 'Confirmer la suppression'
      );
      if (!confirmButton || confirmButton.dataset.abAutoConfirm === '1') return;

      const modalTitle = Array.from(document.querySelectorAll('h2')).find(
        title => title.textContent.trim() === "Modifier l'affectation"
      );
      const modal = modalTitle?.parentElement?.parentElement;
      if (!modal || !modal.contains(confirmButton)) return;

      confirmButton.dataset.abAutoConfirm = '1';
      const warning = Array.from(modal.querySelectorAll('div')).find(div =>
        div.textContent.trim().startsWith('Confirmer la suppression de cette affectation ?')
      );
      if (warning) warning.style.display = 'none';
      requestAnimationFrame(() => confirmButton.click());
    });
    abDeleteObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
  </script>
</body>
</html>
