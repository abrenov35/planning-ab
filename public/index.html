<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>AB Planning - Gantt</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📅</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #root { touch-action: auto; }

    .gantt-scroll { scrollbar-width: none !important; -ms-overflow-style: none !important; }
    .gantt-scroll::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }

    /* V96 : encadrement bleu de l'entete, meme trait que les separateurs du planning */
    .gantt-scroll > div:first-child {
      border-top: 2px solid #1e3a8a !important;
      border-bottom: 2px solid #1e3a8a !important;
      box-sizing: border-box !important;
    }
    /* Trait bleu entre la ligne du mois et la ligne des dates */
    .gantt-scroll > div:first-child > div:nth-child(2) > div:first-child {
      border-bottom: 2px solid #1e3a8a !important;
    }

    /* Separateur choisi sur la fiche ouvrier : bleu fonce et legerement renforce */
    .gantt-scroll div[style*="height: 3px"][style*="rgb(148, 163, 184)"],
    .gantt-scroll div[style*="height:3px"][style*="#94a3b8"] {
      height: 2px !important;
      background: #1e3a8a !important;
    }

    .gantt-scroll div[title] { font-size: 11px !important; }
    .gantt-scroll div[title] + div[title] { font-size: 8px !important; height: 9px !important; line-height: 9px !important; }
    @media (max-width: 1100px) and (pointer: coarse) {
      .gantt-scroll div[title] { font-size: 9px !important; }
      .gantt-scroll div[title] + div[title] { font-size: 8px !important; height: 9px !important; line-height: 9px !important; }
    }

    #root div[title]:empty { background-color: #9CA3AF !important; background-image: none !important; opacity: 1 !important; }
  </style>
</head>
<body>
  <noscript>Tu dois activer JavaScript pour utiliser cette app.</noscript>
  <div id="root"></div>
  <script>
    const abDeleteObserver = new MutationObserver(() => {
      const confirmButton = Array.from(document.querySelectorAll('button')).find(
        button => button.textContent.trim() === 'Confirmer la suppression'
      );
      if (!confirmButton || confirmButton.dataset.abAutoConfirm === '1') return;
      const modalTitle = Array.from(document.querySelectorAll('h2')).find(
        title => title.textContent.trim() === "Modifier l'affectation"
      );
      const modal = modalTitle?.parentElement?.parentElement;
      if (!modal || !modal.contains(confirmButton)) return;
      confirmButton.dataset.abAutoConfirm = '1';
      const warning = Array.from(modal.querySelectorAll('div')).find(div =>
        div.textContent.trim().startsWith('Confirmer la suppression de cette affectation ?')
      );
      if (warning) warning.style.display = 'none';
      requestAnimationFrame(() => confirmButton.click());
    });
    abDeleteObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
  </script>
</body>
</html>
