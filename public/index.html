<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"/><meta name="theme-color" content="#1e3a8a"/><title>AB Planning - Gantt</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📅</text></svg>"/><script src="https://cdn.tailwindcss.com"></script><style>
html,body,#root{touch-action:auto}.gantt-scroll{scrollbar-width:none!important;-ms-overflow-style:none!important}.gantt-scroll::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}.gantt-scroll>div:first-child{border-top:2px solid #1e3a8a!important;border-bottom:0!important;box-sizing:border-box!important}.gantt-scroll>div:first-child>div:nth-child(2)>div:first-child{border-bottom:2px solid #1e3a8a!important}.gantt-scroll>div:nth-child(2){height:2px!important;min-height:2px!important;background:#1e3a8a!important}.gantt-scroll div[style*="height: 3px"][style*="rgb(148, 163, 184)"],.gantt-scroll div[style*="height:3px"][style*="#94a3b8"]{height:2px!important;background:#1e3a8a!important}.gantt-scroll div[title]{font-size:11px!important}.gantt-scroll div[title]+div[title]{font-size:8px!important;height:9px!important;line-height:9px!important}.gantt-scroll span,.gantt-scroll div[title]{text-overflow:clip!important}@media(max-width:1100px) and (pointer:coarse){.gantt-scroll div[title]{font-size:9px!important}.gantt-scroll div[title]+div[title]{font-size:8px!important;height:9px!important;line-height:9px!important}}#root div[title]:empty{background-color:#9CA3AF!important;background-image:none!important;opacity:1!important}.ab-today-cell{position:relative!important}.ab-today-cell>.ab-today-button{position:absolute!important;left:8px!important;right:8px!important;top:50%!important;transform:translateY(-50%)!important;width:auto!important;height:28px!important;margin:0!important;padding:0 6px!important;z-index:30!important;background:#10b981!important;border:1px solid rgba(255,255,255,.42)!important;border-radius:5px!important;color:white!important;font-size:10px!important;font-weight:700!important;display:flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important;box-sizing:border-box!important}.ab-readonly-badge{height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.42);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:800;background:#64748b;white-space:nowrap;flex-shrink:0}
</style></head><body><noscript>Tu dois activer JavaScript pour utiliser cette app.</noscript><div id="root"></div><script>
const abReadOnly=new URLSearchParams(window.location.search).get('mode')==='lecture';if(abReadOnly)localStorage.setItem('currentPage','gantt');
const fitLongGanttNames=()=>{document.querySelectorAll('.gantt-scroll div[title] > span').forEach(span=>{if(!span.parentElement||!span.textContent.trim())return;const maxSize=window.matchMedia('(max-width: 1100px) and (pointer: coarse)').matches?9:11;let size=maxSize;span.style.setProperty('font-size',`${size}px`,'important');while(span.scrollWidth>span.clientWidth+1&&size>5){size-=.5;span.style.setProperty('font-size',`${size}px`,'important')}})};
const contrastPalette=['#2563eb','#10b981','#8b5cf6','#ef4444','#06b6d4','#ec4899','#14b8a6','#6366f1'];const rgbKey=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
const applyAdjacentColorContrast=()=>{const gantt=document.querySelector('.gantt-scroll');if(!gantt)return;const bars=Array.from(gantt.querySelectorAll('div[title]')).filter(el=>{const r=el.getBoundingClientRect();return el.querySelector('span')&&r.width>20&&r.height>=12&&r.height<=32});bars.forEach(el=>{if(!el.dataset.abBaseColor)el.dataset.abBaseColor=getComputedStyle(el).backgroundColor;el.style.setProperty('background-color',el.dataset.abBaseColor,'important')});const groups=new Map();bars.forEach(el=>{const r=el.getBoundingClientRect(),label=(el.querySelector('span')?.textContent||'').trim().toUpperCase();if(!label)return;const arr=groups.get(label)||[];arr.push({el,r,base:rgbKey(el.dataset.abBaseColor)});groups.set(label,arr)});const labels=[...groups.keys()],alt=new Map();for(let i=0;i<labels.length;i++)for(let j=i+1;j<labels.length;j++){const la=labels[i],lb=labels[j];let conflict=false,base='';outer:for(const a of groups.get(la))for(const b of groups.get(lb)){if(a.base!==b.base)continue;const yOverlap=Math.min(a.r.bottom,b.r.bottom)-Math.max(a.r.top,b.r.top);const hGap=Math.max(0,Math.max(a.r.left,b.r.left)-Math.min(a.r.right,b.r.right));if(yOverlap>Math.min(a.r.height,b.r.height)*.6&&hGap<=6){conflict=true;base=a.base;break outer}}if(conflict&&!alt.has(lb)){const used=new Set([base,...alt.values()].map(rgbKey));alt.set(lb,contrastPalette.find(c=>!used.has(rgbKey(c)))||'#2563eb')}}groups.forEach((items,label)=>{const color=alt.get(label);if(color)items.forEach(({el})=>el.style.setProperty('background-color',color,'important'))})};
const applyReadOnlyUi=()=>{if(!abReadOnly)return;Array.from(document.querySelectorAll('button')).forEach(button=>{const text=button.textContent.trim();if(text.includes('Chantiers')||text.includes('Ouvriers')||text.includes('Annuler'))button.style.display='none'});const topBar=Array.from(document.querySelectorAll('div')).find(div=>div.textContent?.trim().startsWith('AB PLANNING')&&div.querySelector('button'));if(topBar&&!topBar.querySelector('.ab-readonly-badge')){const badge=document.createElement('div');badge.className='ab-readonly-badge';badge.textContent='Lecture seule';topBar.appendChild(badge)}};
const blockReadOnlyEdit=event=>{if(!abReadOnly)return;const gantt=event.target?.closest?.('.gantt-scroll');if(!gantt)return;const button=event.target?.closest?.('button');if(button&&["Aujourd'hui",'Aujourd’hui','Auj.'].includes(button.textContent.trim()))return;if(['click','dblclick','touchend'].includes(event.type)){event.stopPropagation();if(event.type!=='touchend')event.preventDefault()}};document.addEventListener('click',blockReadOnlyEdit,true);document.addEventListener('dblclick',blockReadOnlyEdit,true);document.addEventListener('touchend',blockReadOnlyEdit,true);
let visualFrame=0;const refreshGanttVisuals=()=>{cancelAnimationFrame(visualFrame);visualFrame=requestAnimationFrame(()=>{fitLongGanttNames();applyAdjacentColorContrast()})};const abUiObserver=new MutationObserver(()=>{if(!abReadOnly){const confirmButton=Array.from(document.querySelectorAll('button')).find(button=>button.textContent.trim()==='Confirmer la suppression');if(confirmButton&&confirmButton.dataset.abAutoConfirm!=='1'){const modalTitle=Array.from(document.querySelectorAll('h2')).find(title=>title.textContent.trim()==="Modifier l'affectation"),modal=modalTitle?.parentElement?.parentElement;if(modal&&modal.contains(confirmButton)){confirmButton.dataset.abAutoConfirm='1';const warning=Array.from(modal.querySelectorAll('div')).find(div=>div.textContent.trim().startsWith('Confirmer la suppression de cette affectation ?'));if(warning)warning.style.display='none';requestAnimationFrame(()=>confirmButton.click())}}}const gantt=document.querySelector('.gantt-scroll'),targetCell=gantt?.firstElementChild?.firstElementChild,todayButton=Array.from(document.querySelectorAll('button')).find(button=>['Auj.','Aujourd’hui',"Aujourd'hui"].includes(button.textContent.trim()));if(targetCell&&todayButton&&todayButton.parentElement!==targetCell){targetCell.classList.add('ab-today-cell');todayButton.classList.add('ab-today-button');todayButton.textContent="Aujourd'hui";targetCell.appendChild(todayButton)}applyReadOnlyUi();refreshGanttVisuals()});abUiObserver.observe(document.body,{childList:true,subtree:true,characterData:true});window.addEventListener('resize',refreshGanttVisuals);window.addEventListener('scroll',refreshGanttVisuals,true);setTimeout(refreshGanttVisuals,300);setTimeout(refreshGanttVisuals,1000);setTimeout(refreshGanttVisuals,2000);
</script></body></html>
