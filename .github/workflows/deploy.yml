name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Increment version
        run: |
          VERSION=$(grep -oP "v\K\d+" src/components/Sidebar.jsx | head -1)
          NEW_VERSION=$((VERSION + 1))
          sed -i "s/v$VERSION/v$NEW_VERSION/g" src/components/Sidebar.jsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit & Push version change
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add src/components/Sidebar.jsx
          git commit -m "Auto-increment version" || echo "No version change"
          git push || echo "Nothing to push"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
