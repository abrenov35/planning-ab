name: Distinction homonymes Planning

on:
  push:
    paths:
      - '.github/workflows/tmp-homonym-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sécurise et distingue les homonymes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: attendu 1 occurrence, trouvé {n}')
              p.write_text(s.replace(old, new, 1))

          # Liste d'affectation : un repère court uniquement quand le nom est en double.
          replace_once(
              'src/components/FormAffectation.jsx',
              '''  const chantiersActifs = chantiers\n    .filter(c => c.statut === "Actif")\n    .sort((a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr", { sensitivity: "base" }));\n''',
              '''  const chantiersActifs = chantiers\n    .filter(c => c.statut === "Actif")\n    .sort((a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr", { sensitivity: "base" }));\n  const normalizeChantierName = value => String(value || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").trim().toUpperCase();\n  const shortChantierId = id => String(id ?? "").replace(/\\s+/g, "").slice(-4).toUpperCase() || "?";\n  const homonymCounts = new Map();\n  chantiersActifs.forEach(c => {\n    const key = normalizeChantierName(c.nom);\n    homonymCounts.set(key, (homonymCounts.get(key) || 0) + 1);\n  });\n  const chantierLabel = c => homonymCounts.get(normalizeChantierName(c.nom)) > 1\n    ? `${c.nom} · #${shortChantierId(c.id)}`\n    : c.nom;\n'''
          )
          replace_once(
              'src/components/FormAffectation.jsx',
              '''              {chantiersActifs.map(c=><option key={c.id} value={c.id}>{c.nom}</option>)}''',
              '''              {chantiersActifs.map(c=><option key={c.id} value={c.id}>{chantierLabel(c)}</option>)}'''
          )

          # Page Chantiers : repère visuel discret seulement pour les homonymes.
          replace_once(
              'src/pages/ChantierPage.jsx',
              '''  const actifs = chantiers.filter(c => c.statut === "Actif").sort(triAlpha);\n  const archived = chantiers.filter(c => c.statut === "Archivé").sort(triAlpha);\n''',
              '''  const actifs = chantiers.filter(c => c.statut === "Actif").sort(triAlpha);\n  const archived = chantiers.filter(c => c.statut === "Archivé").sort(triAlpha);\n  const normalizeChantierName = value => String(value || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").trim().toUpperCase();\n  const shortChantierId = id => String(id ?? "").replace(/\\s+/g, "").slice(-4).toUpperCase() || "?";\n  const homonymCounts = new Map();\n  chantiers.forEach(c => {\n    const key = normalizeChantierName(c.nom);\n    homonymCounts.set(key, (homonymCounts.get(key) || 0) + 1);\n  });\n  const isHomonym = chantier => homonymCounts.get(normalizeChantierName(chantier.nom)) > 1;\n'''
          )
          replace_once(
              'src/pages/ChantierPage.jsx',
              '''          {chantier.nom}\n        </span>''',
              '''          {chantier.nom}\n          {isHomonym(chantier) && <span title="Repère d’homonyme" style={{fontSize:9,fontWeight:700,color:"#6b7280",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:4,padding:"1px 4px"}}>#{shortChantierId(chantier.id)}</span>}\n        </span>'''
          )

          # Gantt/recherche : ne jamais choisir silencieusement le premier homonyme.
          replace_once(
              'src/components/GanttChart.jsx',
              '''  const normalize = value => String(value ?? "").trim().toUpperCase();\n  const isPlanning = aff => normalize(aff?.nomExterne || aff?.affectationNom || aff?.tache) === "PLANNING";''',
              '''  const normalize = value => String(value ?? "").trim().toUpperCase();\n  const normalizeChantierName = value => String(value ?? "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").trim().toUpperCase();\n  const shortChantierId = id => String(id ?? "").replace(/\\s+/g, "").slice(-4).toUpperCase() || "?";\n  const homonymCounts = new Map();\n  chantiers.forEach(c => {\n    const key = normalizeChantierName(c?.nom);\n    homonymCounts.set(key, (homonymCounts.get(key) || 0) + 1);\n  });\n  const isHomonym = chantier => !!chantier && homonymCounts.get(normalizeChantierName(chantier.nom)) > 1;\n  const displayChantierName = chantier => isHomonym(chantier) ? `${chantier.nom} · #${shortChantierId(chantier.id)}` : chantier.nom;\n  const isPlanning = aff => normalize(aff?.nomExterne || aff?.affectationNom || aff?.tache) === "PLANNING";'''
          )
          replace_once(
              'src/components/GanttChart.jsx',
              '''  const getLetters = (aff, chantier) => isHorsGantt(aff, chantier) ? "" : String(chantier?.nom ?? "").trim().substring(0,4).toUpperCase();''',
              '''  const getLetters = (aff, chantier) => {\n    if (isHorsGantt(aff, chantier)) return "";\n    const base = String(chantier?.nom ?? "").trim().substring(0,4).toUpperCase();\n    return isHomonym(chantier) ? `${base}·${shortChantierId(chantier.id).slice(-2)}` : base;\n  };'''
          )
          replace_once(
              'src/components/GanttChart.jsx',
              '''  const findFirstChantierAffectation = query => {\n    const searched=normalize(query);\n    const chantier=chantiers.find(c => String(c.id) === String(query) || normalize(c.nom) === searched)\n      || chantiers.find(c => normalize(c.nom).includes(searched));\n    if(!chantier) return {success:false,message:"Chantier introuvable."};''',
              '''  const findFirstChantierAffectation = query => {\n    const searched=normalizeChantierName(query);\n    let chantier=chantiers.find(c => String(c.id) === String(query));\n    if(!chantier){\n      const exact=chantiers.filter(c => normalizeChantierName(c.nom) === searched);\n      if(exact.length>1) return {success:false,message:"Plusieurs chantiers portent ce nom. Choisissez celui avec son repère #."};\n      if(exact.length===1) chantier=exact[0];\n    }\n    if(!chantier){\n      const partial=chantiers.filter(c => normalizeChantierName(c.nom).includes(searched));\n      if(partial.length>1) return {success:false,message:"Plusieurs chantiers correspondent. Choisissez celui avec son repère #."};\n      chantier=partial[0];\n    }\n    if(!chantier) return {success:false,message:"Chantier introuvable."};'''
          )
          replace_once(
              'src/components/GanttChart.jsx',
              '''searchChantiers:chantiersActifs.map(c=>({id:c.id,nom:c.nom}))''',
              '''searchChantiers:chantiersActifs.map(c=>({id:c.id,nom:displayChantierName(c)}))'''
          )
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FormAffectation.jsx src/pages/ChantierPage.jsx src/components/GanttChart.jsx
          git commit -m 'Distingue les chantiers homonymes dans Planning'
          git push
