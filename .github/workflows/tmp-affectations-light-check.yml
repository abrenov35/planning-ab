name: Vérifications légères affectations

on:
  push:
    paths:
      - '.github/workflows/tmp-affectations-light-check.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remplace les relectures complètes de vérification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/AppContext.jsx')
          s=p.read_text()
          old1='''      try {\n        const data = await api.getAll();\n        const serveur = Array.isArray(data?.affectations) ? data.affectations : [];\n        if (serveur.some(a => memeAffectation(a, optimistic))) {'''
          new1='''      try {\n        const serveur = await api.getAffectationsStrict();\n        if (serveur.some(a => memeAffectation(a, optimistic))) {'''
          old2='''      try {\n        const data = await api.getAll();\n        const serveur = Array.isArray(data?.affectations) ? data.affectations : [];\n        const existe = serveur.some(a =>'''
          new2='''      try {\n        const serveur = await api.getAffectationsStrict();\n        const existe = serveur.some(a =>'''
          if s.count(old1)!=1: raise SystemExit(f'création: {s.count(old1)} occurrence(s)')
          if s.count(old2)!=1: raise SystemExit(f'suppression: {s.count(old2)} occurrence(s)')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.jsx
          git commit -m 'Réduit les relectures complètes après affectation'
          git push
